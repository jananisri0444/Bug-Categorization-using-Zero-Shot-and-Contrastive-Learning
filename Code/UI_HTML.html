<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bug Classifier with Puter.js</title>
  <script src="https://js.puter.com/v2/"></script>
  <style>
    body {
      background-color: #1b1312; /* deepest dark brown */
      color: #f8e9e7;
      font-family: 'Arial', sans-serif;
      padding: 40px;
      margin: 0;
      text-align: center;
    }

    h1 {
      color: #751c1c; /* deep crimson */
      font-size: 2.5rem;
      margin-bottom: 30px;
    }

    textarea {
      padding: 15px;
      background-color: #2c1a1a; /* dark maroon */
      border: 1px solid #401a1a; /* mahogany */
      color: #ffeaea; /* light pinkish white */
      font-size: 16px;
      border-radius: 8px;
      width: 80%;
      max-width: 600px;
      resize: vertical;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    textarea::placeholder {
      color: #a36b6b;
    }

    textarea:hover {
      border-color: #731f1f; /* warmer red on hover */
    }

    button {
      background-color: #5e1a1a; /* dark wine red */
      color: white;
      padding: 14px 28px;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.3s ease, background-color 0.3s ease;
      margin-top: 20px;
      width: 200px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    button:hover {
      background-color: #8e1f1f; /* vivid garnet */
      transform: scale(1.05);
    }

    #predictionResult {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #f0c7c7;
    }

    .spinner {
      color: #c48a8a;
      font-size: 18px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Bug Description Classifier </h1>
  <textarea id="bugDescription" placeholder="Enter a bug description..." rows="4" cols="50"></textarea>
  <br><br>
  <button onclick="classifyBug()">Classify Bug</button>

  <div id="spinnerContainer"></div>
  <h3 id="predictionResult"></h3>

  <script>
    function showSpinner(message) {
      const spinnerContainer = document.getElementById("spinnerContainer");
      spinnerContainer.innerHTML = `<div class="spinner">⏳ ${message}</div>`;
    }

    function hideSpinner() {
      document.getElementById("spinnerContainer").innerHTML = "";
    }

    function classifyBug() {
      var bugDescription = document.getElementById("bugDescription").value;

      if (bugDescription.trim() === "") {
        alert("Please enter a bug description.");
        return;
      }

      document.getElementById("predictionResult").innerHTML = "Classifying...";

      // Simulate pipeline steps
      showSpinner("Step 1: Converting description to SBERT embedding...");
      setTimeout(() => {
        hideSpinner();
        showSpinner("Step 2: Passing through Siamese Network...");
        setTimeout(() => {
          hideSpinner();
          showSpinner("Step 3: Standardizing features...");
          setTimeout(() => {
            hideSpinner();
            showSpinner("Step 4: Predicting category...");
            puter.ai.chat(
              `Classify the following bug report into one of these categories and only return the output category, no need explanation: Performance & Resource Issues, Functionality & Behavior Issues, Crash & Failure Issues, Build & Compilation Issues, UI & Display Issues. Bug report: ${bugDescription}`,
              { model: "gpt-4o" }
            ).then(response => {
              document.getElementById("predictionResult").innerHTML = 'Predicted Category: ' + response;
              hideSpinner();
            }).catch(error => {
              document.getElementById("predictionResult").innerHTML = 'Error: ' + error.message;
              hideSpinner();
            });
          }, 1000);
        }, 1000);
      }, 1000);
    }
  </script>
</body>
</html>
